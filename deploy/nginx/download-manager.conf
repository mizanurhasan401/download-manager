# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name downloadvideos.work.gd www.downloadvideos.work.gd 84.247.191.28;

    return 301 https://downloadvideos.work.gd$request_uri;
}

# HTTPS — SSL paths added by Certbot on first run
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name downloadvideos.work.gd www.downloadvideos.work.gd;

    ssl_certificate /etc/letsencrypt/live/downloadvideos.work.gd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/downloadvideos.work.gd/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Single API gateway — the frontend only ever talks to /api/*.
    # Nginx routes each sub-path to its service and maps it onto the service's
    # internal /api/v1 prefix.

    # Video downloads
    location /api/videos/ {
        rewrite ^/api/videos/(.*)$ /api/v1/$1 break;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        client_max_body_size 2048M;
    }

    # Image tools
    location /api/images/ {
        rewrite ^/api/images/(.*)$ /api/v1/$1 break;
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        client_max_body_size 50M;
    }

    # File converter
    location /api/convert/ {
        rewrite ^/api/convert/(.*)$ /api/v1/$1 break;
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
        client_max_body_size 50M;
    }
}
