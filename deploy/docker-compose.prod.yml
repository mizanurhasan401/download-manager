services:
  postgres:
    image: postgres:16-alpine
    container_name: download-manager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: download_manager
      POSTGRES_PASSWORD: download_manager
      POSTGRES_DB: download_manager
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/02-init-databases.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U download_manager -d download_manager']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: download-manager-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: download-manager-postgres-data
  redis_data:
    name: download-manager-redis-data
