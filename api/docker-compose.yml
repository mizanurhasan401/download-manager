services:
  postgres:
    image: postgres:16-alpine
    container_name: download-manager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: download_manager
      POSTGRES_PASSWORD: download_manager
      POSTGRES_DB: download_manager
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U download_manager -d download_manager']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: download-manager-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:latest
    container_name: download-manager-adminer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    ports:
      - '${ADMINER_PORT:-8080}:8080'

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: download-manager-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.development
    environment:
      HOST: 0.0.0.0
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    ports:
      - '${PORT:-3000}:3000'
    volumes:
      - ./storage:/app/storage
    profiles:
      - full

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: download-manager-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.development
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    command: ['node', 'dist/workers/download.worker.js']
    volumes:
      - ./storage:/app/storage
    profiles:
      - full

volumes:
  postgres_data:
    name: download-manager-postgres-data
  redis_data:
    name: download-manager-redis-data
